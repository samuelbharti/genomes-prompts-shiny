<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" role="img"
     aria-label="Four steps. Human cancer cells of fifty kinds are grown in a lab; a drug is added, three hundred and seventy-nine of them at several strengths; every single cell is then read one at a time to record which genes it was using; the result is one row per cell, a hundred million rows.">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#EE6331"/>
    </marker>
    <style>
      .step { font-family: "Source Code Pro", Consolas, monospace; font-size: 12px;
              font-weight: 600; letter-spacing: 1.4px; fill: #447099; }
      .cap  { font-family: "Open Sans", "Segoe UI", sans-serif; font-size: 14px; fill: #404041; }
      .sub  { font-family: "Open Sans", "Segoe UI", sans-serif; font-size: 13px; fill: #404041; opacity: .68; }
    </style>
  </defs>

  <g stroke="#EE6331" stroke-width="1.8" marker-end="url(#arw)" fill="none">
    <path d="M212 96 H252"/>
    <path d="M462 96 H502"/>
    <path d="M712 96 H752"/>
  </g>

  <!-- 1. cells in a dish -->
  <text x="24" y="26" class="step">1 · CELLS</text>
  <circle cx="112" cy="96" r="52" fill="#F2F2F2" stroke="#b9c2c8" stroke-width="2"/>
  <circle cx="112" cy="96" r="43" fill="none" stroke="#d3d9dd"/>
  <g fill="#447099" opacity="0.8">
    <circle cx="92"  cy="80"  r="6"/><circle cx="120" cy="74" r="6"/>
    <circle cx="132" cy="98"  r="6"/><circle cx="100" cy="108" r="6"/>
    <circle cx="124" cy="118" r="6"/><circle cx="82"  cy="102" r="6"/>
  </g>
  <text x="112" y="176" text-anchor="middle" class="cap">Human cancer cells</text>
  <text x="112" y="194" text-anchor="middle" class="sub">50 different kinds</text>

  <!-- 2. add a drug -->
  <text x="274" y="26" class="step">2 · DRUG</text>
  <path d="M362 52 C384 82 396 96 396 110 a34 34 0 0 1 -68 0 c0 -14 12 -28 34 -58 Z"
        fill="#EE6331" fill-opacity="0.14" stroke="#EE6331" stroke-width="2"/>
  <circle cx="362" cy="112" r="9" fill="#EE6331" opacity="0.5"/>
  <text x="362" y="176" text-anchor="middle" class="cap">Add a drug</text>
  <text x="362" y="194" text-anchor="middle" class="sub">379 of them, several strengths</text>

  <!-- 3. read every cell, one at a time -->
  <text x="524" y="26" class="step">3 · READ EACH CELL</text>
  <rect x="556" y="54" width="124" height="84" rx="4" fill="#fff" stroke="#419599" stroke-width="2"/>
  <g stroke="#419599" stroke-width="3" stroke-linecap="round">
    <line x1="572" y1="122" x2="572" y2="96"/>
    <line x1="586" y1="122" x2="586" y2="78"/>
    <line x1="600" y1="122" x2="600" y2="104"/>
    <line x1="614" y1="122" x2="614" y2="70"/>
    <line x1="628" y1="122" x2="628" y2="92"/>
    <line x1="642" y1="122" x2="642" y2="82"/>
    <line x1="656" y1="122" x2="656" y2="110"/>
  </g>
  <circle cx="666" cy="66" r="7" fill="#419599" opacity="0.75"/>
  <text x="618" y="176" text-anchor="middle" class="cap">Read every cell, one at a time</text>
  <text x="618" y="194" text-anchor="middle" class="sub">which genes was it using?</text>

  <!-- 4. one row per cell -->
  <text x="774" y="26" class="step">4 · ONE ROW PER CELL</text>
  <g>
    <rect x="792" y="56" width="180" height="82" rx="3" fill="#fff" stroke="#c9cfd4"/>
    <g stroke="#447099" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round">
      <line x1="804" y1="68"  x2="960" y2="68"/>
      <line x1="804" y1="80"  x2="944" y2="80"/>
      <line x1="804" y1="92"  x2="958" y2="92"/>
      <line x1="804" y1="104" x2="932" y2="104"/>
      <line x1="804" y1="116" x2="954" y2="116"/>
      <line x1="804" y1="128" x2="918" y2="128"/>
    </g>
  </g>
  <text x="882" y="176" text-anchor="middle" class="cap">One row per cell</text>
  <text x="882" y="194" text-anchor="middle" class="sub">100.6 million rows</text>
</svg>
