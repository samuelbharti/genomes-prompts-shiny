name: Deploy resource site

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "index_files/**"
      - "assets/**"
      - "scripts/stage-site.sh"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The deck is the site. stage-site.sh gathers the rendered deck, its
      # support files and the assets it links into one directory.
      - name: Assemble Pages artifact
        run: bash scripts/stage-site.sh _deploy

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
